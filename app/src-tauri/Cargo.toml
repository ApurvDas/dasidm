[package]
name = "dasidm"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ApurvDas/dasidm"
description = "DasIDM download manager"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
arboard = { version = "3.7.0", default-features = false }
das-core = { version = "0.1.0", path = "../../crates/das-core" }
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
# The Firefox helper's pipe (same tokio as the core).
tokio = { version = "1.54.1", features = ["net", "io-util", "rt-multi-thread"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
