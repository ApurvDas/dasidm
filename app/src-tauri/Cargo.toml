[package]
name = "dasidm"
version = "0.2.1"
edition = "2024"
description = "DasIDM download manager"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
arboard = { version = "3.7.0", default-features = false }
das-core = { version = "0.1.0", path = "../../crates/das-core" }
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
