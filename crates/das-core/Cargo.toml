[package]
name = "das-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ApurvDas/dasidm"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
das-engine = { version = "0.1.0", path = "../das-engine" }
das-torrent = { version = "0.1.0", path = "../das-torrent" }
dirs = "7.0.0"
fastrand = "2.5.0"
parking_lot = "0.13.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util"] }
tracing = "0.1.44"
url = "2.5.9"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = "0.8"
librqbit = { version = "9.1.0", default-features = false, features = ["default-tls"] }
tempfile = "3.27.0"
