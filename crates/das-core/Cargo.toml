[package]
name = "das-core"
version = "0.1.0"
edition = "2024"

[dependencies]
das-engine = { version = "0.1.0", path = "../das-engine" }
dirs = "7.0.0"
fastrand = "2.5.0"
parking_lot = "0.13.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tracing = "0.1.44"
url = "2.5.9"

[dev-dependencies]
tempfile = "3.27.0"
