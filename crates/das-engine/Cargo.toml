[package]
name = "das-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.2"
futures-util = "0.3.34"
httpdate = "1.0.3"
parking_lot = "0.13.0"
percent-encoding = "2.3.2"
fastrand = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
url = "2.5.9"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Ioctl", "Win32_System_IO"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["tokio", "http1"] }
tempfile = "3.27.0"
