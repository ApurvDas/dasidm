[package]
name = "das-torrent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ApurvDas/dasidm"
description = "DasIDM torrents: a lazy librqbit session with editable trackers"

[dependencies]
anyhow = "1"
librqbit = { version = "9.1.0", default-features = false, features = ["default-tls"] }
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2.5.9"

[dev-dependencies]
axum = "0.8"
parking_lot = "0.13.0"
tempfile = "3.27.0"
