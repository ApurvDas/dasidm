<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DasIDM</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32.png" alt="" width="20" height="20" />
      <b>DASIDM</b>
      <span id="state" class="state wait">Checking…</span>
    </header>

    <p id="why" class="why" hidden></p>
    <button id="retry" class="btn" hidden>Retry</button>

    <label class="row">
      <span><b>Grab downloads</b><small>Files you download go to DasIDM. Alt+click a link to keep one in Firefox.</small></span>
      <input id="enabled" type="checkbox" role="switch" />
    </label>
    <label class="row">
      <span><b>Also in private windows</b></span>
      <input id="privateToo" type="checkbox" role="switch" />
    </label>
    <label class="row">
      <span><b>Skip files smaller than</b></span>
      <span class="num"><input id="minMb" type="number" min="0" step="1" /> MB</span>
    </label>

    <footer id="last" class="last">Nothing handed over yet.</footer>
    <script src="popup.js"></script>
  </body>
</html>
